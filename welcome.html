<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="welcome-container">

    <!-- LEFT SIDE -->
    <div class="welcome-left">

        <p class="welcome-text">
            Welcome, <span id="userName">User</span>!
        </p>

        <h1 class="title">
            What would you like to do?
        </h1>

        <div class="options">

            <div class="card">
                <img src="./Media/savings.png">
                <h3>Savings</h3>
            </div>

            <div class="card">
                <img src="./Media/investments.png">
                <h3>Investments</h3>
            </div>

        </div>

        <button class="continue-btn">
            Continue
        </button>

        <p class="subtitle">
            Build discipline and earn competitive returns.
        </p>

    </div>

    <!-- RIGHT SIDE -->
    <div class="welcome-right">

        <img src="./Media/welcome-illustration.png" alt="illustration">

    </div>

</div>

</body>
</html>
